[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zinochka"
version = "0.1.0"
description = "Personal AI assistant that integrates with Plaud notes using Zapier"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Zinochka Author"}
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.0.0",
    "openai>=1.0.0",
    "openai-agents>=0.0.1",
    "httpx>=0.27.0",
    "celery>=5.3.0",
    "mcp>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.3.0",
    "black>=24.0.0",
    "isort>=5.12.0"
]

[tool.pytest]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false  # Disable this as we use Celery decorators
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = false  # Disable unused ignore warnings

[[tool.mypy.overrides]]
module = "celery.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "B", "I"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "ruff>=0.11.8",
]
